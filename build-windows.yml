name: Build Windows (EXE 32 bits)

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Vérifier le calcul des horaires de prière
        run: node scripts/test-prayer.js

      - name: Installer les dépendances (Electron 22, compatible Windows 7 et plus)
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Compiler les .exe 32 bits (portable + installateur)
        working-directory: desktop
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Lister les fichiers produits
        run: Get-ChildItem desktop/dist -Filter *.exe | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: rakeb-windows-exe
          path: desktop/dist/*.exe
          if-no-files-found: error

      - name: Publier dans les Releases (tag vX.Y.Z)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/*.exe
