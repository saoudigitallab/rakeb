# Fabrication Windows 10/11 : 32 bits (ia32), 64 bits (x64) et ARM64. Les fichiers de l'application restent ceux de Rakeb.exe.
appId: com.rakeb.desktop
productName: Rakeb
electronVersion: 31.7.7
directories:
  output: dist
files:
  - main.js
  - netcompat.js
  - preload.js
  - index.html
  - "*.png"
  - package.json
asar: true
win:
  icon: icon.png
  target:
    - target: portable
      arch: [ia32, x64, arm64]
    - target: nsis
      arch: [ia32, x64, arm64]
portable:
  artifactName: Rakeb-portable-${version}-${arch}.exe
nsis:
  artifactName: Rakeb-installateur-${version}-${arch}.exe
  oneClick: false
  allowToChangeInstallationDirectory: true
