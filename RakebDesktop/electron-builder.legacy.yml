# Fabrication Windows 7 SP1 / 8 / 8.1 : Electron 22 est la dernière version compatible. 32 bits et 64 bits.
appId: com.rakeb.desktop
productName: Rakeb
electronVersion: 22.3.27
directories:
  output: dist
files:
  - main.js
  - netcompat.js
  - preload.js
  - index.html
  - "*.png"
  - package.json
asar: true
win:
  icon: icon.png
  target:
    - target: portable
      arch: [ia32, x64]
    - target: nsis
      arch: [ia32, x64]
portable:
  artifactName: Rakeb-win7-portable-${version}-${arch}.exe
nsis:
  artifactName: Rakeb-win7-installateur-${version}-${arch}.exe
  oneClick: false
  allowToChangeInstallationDirectory: true
