name: Build Android (APK)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['RakebMobile/**', 'RakebDesktop/index.html', 'RakebDesktop/icon.png', '.github/workflows/build-android.yml']
    tags: ['v*']

permissions:
  contents: write   # pour publier une Release quand on pousse un tag vX.Y.Z

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: RakebMobile
    env:
      # Secrets facultatifs : sans eux, l'APK est signé avec la clé de test du dépôt (RakebMobile/signing/rakeb-test.jks)
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KS_PASS_SECRET: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KS_ALIAS_SECRET: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASS_SECRET: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer Capacitor
        run: npm install --no-audit --no-fund

      - name: Préparer l'application web (même index.html que la version Windows)
        run: node scripts/prepare-web.js

      - name: Générer le projet Android
        run: npx cap add android

      - name: Version, permissions et icônes
        run: node scripts/android-setup.js
        env:
          VERSION_CODE: ${{ github.run_number }}

      - name: Synchroniser l'application web
        run: npx cap sync android

      - name: Accepter les licences du SDK Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Compiler l'APK (téléphones et tablettes, Android 5.1 et plus)
        working-directory: RakebMobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Aligner et signer l'APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            KS="$RUNNER_TEMP/release.jks"; KPASS="$KS_PASS_SECRET"; ALIAS="$KS_ALIAS_SECRET"; KEYPASS="$KEY_PASS_SECRET"
            echo "Signature avec votre clé (secrets GitHub)."
          else
            KS="signing/rakeb-test.jks"; KPASS="rakeb-test-key"; ALIAS="rakeb"; KEYPASS="rakeb-test-key"
            echo "Signature avec la clé de test du dépôt."
          fi
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$KS" --ks-pass "pass:$KPASS" --ks-key-alias "$ALIAS" --key-pass "pass:$KEYPASS" \
            --out Rakeb-android.apk "$RUNNER_TEMP/aligned.apk"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Vérifier l'APK (paquet, Android minimal, signature)
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt" dump badging Rakeb-android.apk | grep -E "^package:|sdkVersion|targetSdk" || true
          "$BT/apksigner" verify --verbose Rakeb-android.apk | head -8

      - uses: actions/upload-artifact@v4
        with:
          name: rakeb-android-apk
          path: RakebMobile/Rakeb-android.apk
          if-no-files-found: error

      - name: Publier dans les Releases (tag vX.Y.Z)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: RakebMobile/Rakeb-android.apk
