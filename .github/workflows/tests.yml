name: Tests automatiques

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths: ['RakebDesktop/**', 'RakebMobile/**', 'tests/**']

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests de l'application
        working-directory: tests
        run: |
          npm ci --no-audit --no-fund
          npm test
